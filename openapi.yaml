  /wodtrackr/exercise-programs/{program_id}/reuse/:
    post:
      summary: Reuse (clone) an exercise program
      description: Clones a visible program (public or owned) into the authenticated user's library as a new private program. All items including week, day, sets, reps, load, and rest_seconds are copied.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: program_id
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Cloned program created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ExerciseProgram'
        '401':
          description: Unauthorized
          content:
