  /wodtrackr/exercise-programs/:
    get:
      summary: List exercise programs
      description: Returns public programs plus programs owned by the authenticated user. Supports search, filtering, and ordering.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search across name and description.
        - in: query
          name: is_public
          schema:
            type: boolean
          description: Filter by visibility.
        - in: query
          name: mine
          schema:
            type: boolean
          description: When true, returns only programs created by the authenticated user.
        - in: query
          name: created_by
          schema:
            type: integer
          description: Filter by creator user ID (admin only).
        - in: query
          name: category
          schema:
            type: string
            enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        - in: query
          name: equipment
          schema:
            type: string
            enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        - in: query
          name: muscle
          schema:
            type: string
          description: Filter by primary_muscle_group (contains).
        - in: query
          name: goal
          schema:
            type: string
            enum: [strength, hypertrophy, endurance, fat_loss, mobility, performance, general_fitness, other]
        - in: query
          name: exercise_id
          schema:
            type: integer
          description: Filter programs that contain the given exercise ID.
        - in: query
          name: custom_exercise_id
          schema:
            type: integer
          description: Filter programs that contain the given custom exercise ID.
        - in: query
          name: ordering
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, updated_at, -updated_at]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExerciseProgram'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create exercise program
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseProgramCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ExerciseProgram'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
