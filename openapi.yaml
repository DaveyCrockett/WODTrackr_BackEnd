openapi: 3.0.3
info:
  title: WODTrackr Backend API
  version: 1.0.0
  description: OpenAPI documentation for WODTrackr exercise, custom exercise, exercise note, and exercise program endpoints.
servers:
  - url: /api
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Exercise:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 120
        description:
          type: string
        category:
          type: string
          enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        equipment:
          type: string
          enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        primary_muscle_group:
          type: string
          maxLength: 50
        is_public:
          type: boolean
        created_by:
          type: integer
          nullable: true
        created_by_username:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - category
        - equipment
        - is_public
        - created_at
        - updated_at
    ExerciseCreateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        equipment:
          type: string
          enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        primary_muscle_group:
          type: string
        is_public:
          type: boolean
      required:
        - name
    ExerciseUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        equipment:
          type: string
          enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        primary_muscle_group:
          type: string
        is_public:
          type: boolean
    CustomExercise:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 120
        description:
          type: string
        category:
          type: string
          enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        equipment:
          type: string
          enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        primary_muscle_group:
          type: string
          maxLength: 50
        created_by:
          type: integer
        created_by_username:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - category
        - equipment
        - created_at
        - updated_at
    CustomExerciseCreateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        equipment:
          type: string
          enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        primary_muscle_group:
          type: string
      required:
        - title
    CustomExerciseUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        equipment:
          type: string
          enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        primary_muscle_group:
          type: string
    ExerciseNote:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          type: integer
        user_username:
          type: string
        exercise:
          type: integer
          nullable: true
        exercise_name:
          type: string
          nullable: true
        custom_exercise:
          type: integer
          nullable: true
        custom_exercise_title:
          type: string
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - user
        - notes
        - created_at
        - updated_at
    ExerciseNoteCreateRequest:
      type: object
      description: Provide exactly one of exercise or custom_exercise.
      properties:
        exercise:
          type: integer
          nullable: true
        custom_exercise:
          type: integer
          nullable: true
        notes:
          type: string
      required:
        - notes
    ExerciseNoteUpdateRequest:
      type: object
      description: Provide exactly one of exercise or custom_exercise if changing target.
      properties:
        exercise:
          type: integer
          nullable: true
        custom_exercise:
          type: integer
          nullable: true
        notes:
          type: string
    ExerciseProgramItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        exercise:
          type: integer
          nullable: true
        exercise_name:
          type: string
          nullable: true
        custom_exercise:
          type: integer
          nullable: true
        custom_exercise_name:
          type: string
          nullable: true
        position:
          type: integer
        notes:
          type: string
          nullable: true
          maxLength: 2000
        week:
          type: string
          nullable: true
          maxLength: 50
        day:
          type: string
          nullable: true
          maxLength: 50
        sets:
          type: string
          nullable: true
          maxLength: 50
        reps:
          type: string
          nullable: true
          maxLength: 50
        load:
          type: string
          nullable: true
          maxLength: 50
        rest_seconds:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - position
        - created_at
        - updated_at
    ExerciseProgramItemRequest:
      type: object
      description: Provide exactly one of exercise or custom_exercise.
      properties:
        exercise:
          type: integer
          nullable: true
        custom_exercise:
          type: integer
          nullable: true
        position:
          type: integer
        notes:
          type: string
          nullable: true
        week:
          type: string
          nullable: true
        day:
          type: string
          nullable: true
        sets:
          type: string
          nullable: true
        reps:
          type: string
          nullable: true
        load:
          type: string
          nullable: true
        rest_seconds:
          type: integer
          nullable: true
      required:
        - position
    ExerciseProgram:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 120
        description:
          type: string
          nullable: true
        category:
          type: string
          enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        equipment:
          type: string
          enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        primary_muscle_group:
          type: string
          maxLength: 50
        goal:
          type: string
          enum: [strength, hypertrophy, endurance, fat_loss, mobility, performance, general_fitness, other]
        is_public:
          type: boolean
        created_by:
          type: integer
        created_by_username:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseProgramItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - is_public
        - created_by
        - items
        - created_at
        - updated_at
    ExerciseProgramCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          nullable: true
          maxLength: 3000
        category:
          type: string
          enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        equipment:
          type: string
          enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        primary_muscle_group:
          type: string
          maxLength: 50
        goal:
          type: string
          enum: [strength, hypertrophy, endurance, fat_loss, mobility, performance, general_fitness, other]
        is_public:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseProgramItemRequest'
      required:
        - name
    ExerciseProgramUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          nullable: true
          maxLength: 3000
        category:
          type: string
          enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        equipment:
          type: string
          enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        primary_muscle_group:
          type: string
          maxLength: 50
        goal:
          type: string
          enum: [strength, hypertrophy, endurance, fat_loss, mobility, performance, general_fitness, other]
        is_public:
          type: boolean
        items:
          type: array
          description: Replaces all existing items when provided.
          items:
            $ref: '#/components/schemas/ExerciseProgramItemRequest'
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        detail:
          oneOf:
            - type: string
            - type: object
paths:
  /wodtrackr/exercises/:
    get:
      summary: List exercises
      description: Returns public exercises plus the authenticated user's exercises. Supports search, filtering, and ordering.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search across name, description, and primary_muscle_group.
        - in: query
          name: category
          schema:
            type: string
            enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        - in: query
          name: equipment
          schema:
            type: string
            enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        - in: query
          name: muscle
          schema:
            type: string
          description: Filter by primary_muscle_group (contains).
        - in: query
          name: is_public
          schema:
            type: boolean
        - in: query
          name: mine
          schema:
            type: boolean
          description: When true, returns only exercises created by the authenticated user.
        - in: query
          name: ordering
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, updated_at, -updated_at]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Exercise'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create exercise
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Exercise'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /wodtrackr/exercises/{exercise_id}/:
    get:
      summary: Retrieve exercise
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: exercise_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Exercise'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update exercise
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: exercise_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Exercise'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete exercise
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: exercise_id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /wodtrackr/custom-exercises/:
    get:
      summary: List custom exercises
      description: Returns custom exercises owned by the authenticated user (admins see all). Supports search, filtering, and ordering.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search across title, description, and primary_muscle_group.
        - in: query
          name: category
          schema:
            type: string
            enum: [weightlifting, powerlifting, gymnastics, monostructural, accessory, mobility, other]
        - in: query
          name: equipment
          schema:
            type: string
            enum: [bodyweight, barbell, dumbbell, kettlebell, medicine_ball, box, rig, rings, rope, rower, bike, ski_erg, assault_runner, jump_rope, sled, sandbag, pegboard, other]
        - in: query
          name: muscle
          schema:
            type: string
          description: Filter by primary_muscle_group (contains).
        - in: query
          name: created_by
          schema:
            type: integer
          description: Filter by creator user ID (admin only).
        - in: query
          name: created_from
          schema:
            type: string
            format: date-time
        - in: query
          name: created_to
          schema:
            type: string
            format: date-time
        - in: query
          name: updated_from
          schema:
            type: string
            format: date-time
        - in: query
          name: updated_to
          schema:
            type: string
            format: date-time
        - in: query
          name: ordering
          schema:
            type: string
            enum: [title, -title, created_at, -created_at, updated_at, -updated_at]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomExercise'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create custom exercise
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomExerciseCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CustomExercise'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /wodtrackr/custom-exercises/{custom_exercise_id}/:
    get:
      summary: Retrieve custom exercise
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: custom_exercise_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CustomExercise'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update custom exercise
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: custom_exercise_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomExerciseUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CustomExercise'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete custom exercise
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: custom_exercise_id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /wodtrackr/exercise-notes/:
    get:
      summary: List exercise notes
      description: Returns notes owned by the authenticated user (admins see all). Filter by exercise_id or custom_exercise_id.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: exercise_id
          schema:
            type: integer
        - in: query
          name: custom_exercise_id
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
          description: Search notes and related exercise titles.
        - in: query
          name: user_id
          schema:
            type: integer
          description: Filter by user ID (admin only).
        - in: query
          name: target
          schema:
            type: string
            enum: [exercise, custom_exercise]
          description: Filter by target type.
        - in: query
          name: has_notes
          schema:
            type: boolean
          description: When true, returns notes with non-empty content.
        - in: query
          name: created_from
          schema:
            type: string
            format: date-time
        - in: query
          name: created_to
          schema:
            type: string
            format: date-time
        - in: query
          name: updated_from
          schema:
            type: string
            format: date-time
        - in: query
          name: updated_to
          schema:
            type: string
            format: date-time
        - in: query
          name: ordering
          schema:
            type: string
            enum: [created_at, -created_at, updated_at, -updated_at]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExerciseNote'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create exercise note
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseNoteCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ExerciseNote'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /wodtrackr/exercise-notes/{note_id}/:
    get:
      summary: Retrieve exercise note
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: note_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ExerciseNote'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update exercise note
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: note_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
